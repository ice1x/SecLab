[package]
name = "seclab-library"
description = "SecLab — patch/preset library and AI knowledge base, backed by embedded drevo."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# drevo is the embedded graph store for the patch library (Epic 11). It is OPTIONAL and
# gated behind the `library` feature, so the default workspace build — and CI's required
# gates — never compile it. We depend on the crate directly (the direct Rust API, not the
# Bolt server) with default features OFF, pulling only the embedded `redb-backend`; this
# drops drevo's heavy `http` (axum/tokio) and `cbindgen` defaults.
#
# GIT dependency, pinned to a revision (was an absolute local path). Cargo resolves every
# dependency's manifest for the lockfile even when it is optional and its feature is off,
# so an absolute-path dep (`/Users/.../drevo`) made EVERY workspace command — `cargo fmt`,
# `cargo test --workspace`, even `cargo metadata` — fail on any machine without that exact
# path. That blocked running CI on GitHub-hosted runners. A pinned git source resolves
# identically everywhere (hosted CI, any clone) and is still only COMPILED under
# `--features library`; `cargo metadata --no-deps` (the fmt gate) does not even fetch it.
# The pin keeps the `library` signal job reproducible; bump it to adopt newer drevo.
#
# To build SecLab against a local drevo checkout, add a `[patch]` to SecLab's ROOT
# Cargo.toml for the duration of the work and do not commit it:
#
#   [patch."https://github.com/ice1x/drevo.git"]
#   drevo = { path = "../drevo" }
#
# A `[patch]` applies to this workspace only. Do NOT use a `paths = [...]` override in
# `~/.cargo/config.toml`: Cargo applies it to every project on the machine (and, through
# the parent-directory config walk, to everything under `~` regardless of CARGO_HOME). It
# redirected `drevo` inside other drevo checkouts and worktrees to one fixed tree, which put
# two `drevo-auth 0.1.0` from different paths in their graph ("failed to select a version
# for `drevo-auth`") and, where resolution did succeed, linked their tests against the
# wrong branch's code.
drevo = { git = "https://github.com/ice1x/drevo.git", rev = "e3f321de3685e91df20d50da548ca7d99dfc4521", default-features = false, optional = true }
# Reading patches to import (000095). seclab-project is a light workspace crate; still gated
# behind `library` so the default build stays untouched.
seclab-project = { workspace = true, optional = true }
# Reading the node registry to build the knowledge graph (000127).
seclab-nodes = { workspace = true, optional = true }
# Building drevo `Properties` (JSON) values when importing patch metadata.
serde_json = { version = "1", optional = true }

[features]
# Off by default: enables the drevo-backed library. Turn on with `--features library`.
default = []
library = ["dep:drevo", "dep:seclab-project", "dep:seclab-nodes", "dep:serde_json"]

[dev-dependencies]
# Only for the CRUD smoke test's JSON property assertions (behind the `library` feature).
serde_json = "1"
# For building a ProjectDoc to import in the import tests (behind `library`).
seclab-project.workspace = true
seclab-core.workspace = true
# For the knowledge-graph test's Registry (behind `library`).
seclab-nodes.workspace = true

[lints]
workspace = true
