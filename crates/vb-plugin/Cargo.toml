[package]
name = "vb-plugin"
description = "VST_bomb — CLAP export (nih-plug), VST3/AU build via clap-wrapper."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
vb-core.workspace = true
vb-nodes.workspace = true
vb-runtime.workspace = true
vb-project.workspace = true
nih_plug.workspace = true
# egui editor embedded in the plugin window (000067). OPTIONAL, behind the `gui` feature:
# the default build (and the required clap-validator CI gate) ships no editor, so a
# headless validator never has to open a window. Same git source as nih_plug so the two
# resolve to one nih-plug revision.
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug.git", optional = true }

[features]
# Embed the egui run-view in the plugin window. Build bundles with `--features gui` to
# get an in-host editor.
gui = ["dep:nih_plug_egui"]

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
# Assistant crate, for the end-to-end MVP scenario test only (scripted dialogue → patch).
# A dev-dependency so it never enters the plugin's runtime graph; vb-ai does not depend on
# vb-plugin, so there is no dependency cycle.
vb-ai.workspace = true

[lints]
workspace = true
