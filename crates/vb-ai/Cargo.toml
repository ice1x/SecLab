[package]
name = "vb-ai"
description = "VST_bomb — AI assistant: grounded prompt assembly and the LLM output contract."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
vb-core.workspace = true
vb-nodes.workspace = true
vb-project.workspace = true
serde.workspace = true
# Real OS-keychain backend for BYOK keys, behind the `keychain` feature so the default
# build (and CI) needs no platform secret-store dependency.
keyring = { version = "3", optional = true, features = ["apple-native"] }

[features]
# Enables KeychainStore, backing BYOK keys with the OS keychain (macOS: Security.framework).
keychain = ["dep:keyring"]

[dev-dependencies]
ron.workspace = true

[lints]
workspace = true
