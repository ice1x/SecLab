[package]
name = "vb-editor"
description = "VST_bomb — egui node editor (canvas, wires, inspector, undo)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
# `cdylib` so the wasm32 build links to a loadable `.wasm` module the browser page can
# import (wasm-pack `--target web`, see web/editor/); `lib` so the native workspace
# (vb-standalone, and the plugin via default-features=false) links it as a normal crate.
crate-type = ["cdylib", "lib"]

[dependencies]
vb-core.workspace = true
vb-nodes.workspace = true
vb-project.workspace = true
egui.workspace = true
# eframe (winit/glutin natively, WebRunner on wasm) is only needed to RUN the editor as its
# own window/app. Behind the `app` feature (on by default) so an embedder that already owns
# a window — the plugin's nih_plug_egui host — can depend on `vb-editor` with
# `default-features = false` and get `EditorApp` + `render(ctx)` without pulling winit.
eframe = { workspace = true, optional = true }
# The assistant chat panel (behind the `assistant` feature) renders the `vb-ai` EditSession
# view-model. Optional so the provider/HTTP stack is pulled in ONLY for that native panel and
# never reaches the wasm or plugin builds. vb-ai does not depend on vb-editor → no cycle.
vb-ai = { workspace = true, optional = true }
serde.workspace = true
ron.workspace = true

[features]
# `app` = the standalone/browser launchers (`run`, `web::start`, `impl eframe::App`). On by
# default so `vb-standalone` and the WASM build are unchanged; turned OFF by the plugin,
# which drives `EditorApp::render` inside its own egui context.
default = ["app"]
app = ["dep:eframe"]

# `assistant` = the native-only AI assistant chat panel (`assistant_panel`, backlog 000108),
# wired into `EditorApp` with a background worker thread that runs the (blocking) provider
# call off the egui frame. OFF by default: it pulls in `vb-ai`, so the wasm and plugin builds
# stay free of the provider stack. Note this level needs NO network — the threaded host runs
# any `AiProvider`, exercised in tests by an in-process double. The CI `assistant` job builds
# and tests it so the code cannot rot.
assistant = ["dep:vb-ai"]

# `assistant-net` = `assistant` plus the real network providers: it turns on `vb-ai`'s `net`
# (reqwest) and `keychain` (OS key store) so `set_assistant_anthropic` / `set_assistant_local`
# can construct `AnthropicProvider`/`LocalProvider`. Kept separate from `assistant` so the
# deterministic panel wiring (and its tests) never pull the HTTP/keychain stack; a host that
# wants live inference opts into this one.
assistant-net = ["assistant", "vb-ai/net", "vb-ai/keychain"]

# WASM (browser) entry point only — see src/web.rs (backlog 000081). These compile solely
# for the wasm32 target, so the native build is untouched. eframe brings the web renderer
# (WebRunner/WebGL) itself; we only need the JS glue for the exported `start(canvas)` fn.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }
console_error_panic_hook = "0.1"

[dev-dependencies]
# Assistant crate, for the proposal → diff → apply integration test only. This is a
# dev-dependency so it never enters the editor's runtime graph; vb-ai does not depend on
# vb-editor, so there is no dependency cycle.
vb-ai.workspace = true
ron.workspace = true
# End-to-end interface tests drive EditorApp through the same public API the plugin/standalone
# UI calls; they need egui coordinate types and vb-core port ids to target ports on the canvas.
egui.workspace = true
vb-core.workspace = true

[lints]
workspace = true
