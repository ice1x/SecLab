[package]
name = "vb-standalone"
description = "VST_bomb — standalone app (cpal + editor)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
vb-core.workspace = true
vb-nodes.workspace = true
vb-runtime.workspace = true
# The standalone runs the editor as its own eframe window, so it needs the `app` feature
# (off by default at the workspace level, where the plugin wants it off).
vb-editor = { workspace = true, features = ["app"] }
cpal.workspace = true
midir.workspace = true
egui.workspace = true
eframe.workspace = true

[lints]
workspace = true
