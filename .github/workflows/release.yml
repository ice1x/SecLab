name: Release

# Builds the distributable bundles on every supported OS, packages them together with the
# license documents, and uploads them as workflow artifacts. Runs on a version tag (`v*`) or
# on manual dispatch. On a tag it also creates a DRAFT GitHub pre-release with every file
# attached and the CHANGELOG notes — a maintainer reviews and publishes it by hand.
# See docs/releasing.md.
#
# Legs:
#   macOS   — CLAP + VST3 (clap-wrapper) + AUv2 (clap-wrapper) + wrapped standalone .app,
#             via the `cargo xtask` bundle commands; per-format zips, an all-in-one zip and a
#             `.pkg` installer (`cargo xtask package-macos`). Developer ID signing and
#             notarization run only when the `DEVELOPER_ID` / `NOTARY_PROFILE` secrets are
#             set; otherwise the bundles are ad-hoc signed (`cargo xtask sign-adhoc`).
#   Linux   — CLAP (nih-plug bundler, with the embedded editor) + the native standalone
#             binary (seclab-standalone: cpal + eframe).
#   Windows — the same two as Linux.
#
# The VST3/AU wrappers are macOS-only for now: `cargo xtask bundle-vst3/-auv2` drive
# clap-wrapper with macOS paths/flags (see xtask). Linux/Windows hosts load the CLAP directly
# (Bitwig, REAPER, FL Studio, Ardour, …); VST3 wrappers for them are a follow-up.
#
# Runner images are perishable pins (GitHub retires them yearly — see the header of ci.yml);
# bump them here too when ci.yml moves.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Only the publish job writes (the draft release); everything else reads.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: macOS bundles
    runs-on: macos-15
    # Job-level env so the optional signing steps can gate on whether the secret is set.
    env:
      DEVELOPER_ID: ${{ secrets.DEVELOPER_ID }}
      NOTARY_PROFILE: ${{ secrets.NOTARY_PROFILE }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # On a version tag, fail fast when the tag does not match the workspace version or the
      # CHANGELOG has no section for it, and keep the notes for the draft release.
      - name: release notes (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          mkdir -p target/dist
          cargo xtask release-notes "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" > target/dist/release-notes.md
          cat target/dist/release-notes.md

      # The wrapped formats rebuild the CLAP WITH the embedded editor (`--features gui`, see
      # xtask `bundle_wrapped`) and ship it next to the wrapper; the first run also clones and
      # builds clap-wrapper under target/ (network).
      - name: build the VST3 (clap-wrapper)
        run: cargo xtask bundle-vst3
      - name: build the AUv2 component (clap-wrapper)
        run: cargo xtask bundle-auv2
      - name: build the wrapped standalone app
        run: cargo xtask bundle-standalone

      # Code-sign every bundle in target/bundled with the Developer ID identity — only when
      # one is configured. Unsigned bundles are still produced and uploaded otherwise. On a
      # GitHub-hosted runner the identity + notary profile would first have to be imported
      # into the job's keychain from secrets; see docs/signing.md.
      - name: code-sign (Developer ID)
        if: ${{ env.DEVELOPER_ID != '' }}
        run: cargo xtask sign

      # Without a Developer ID, seal every bundle with an ad-hoc signature so Apple-silicon
      # hosts load it once the user has cleared Gatekeeper (see the release notes).
      - name: code-sign (ad-hoc)
        if: ${{ env.DEVELOPER_ID == '' }}
        run: cargo xtask sign-adhoc

      # Notarize + staple — only when a notary keychain profile is configured.
      - name: notarize and staple
        if: ${{ env.NOTARY_PROFILE != '' }}
        run: cargo xtask notarize

      # Per-format zips, an all-in-one zip and the .pkg installer, each with the license
      # documents. GITHUB_REF_NAME is the tag (v0.1.0 → 0.1.0) or, on a manual run, the branch.
      - name: package the bundles
        run: cargo xtask package-macos "$GITHUB_REF_NAME"

      - name: upload the macOS bundles artifact
        uses: actions/upload-artifact@v4
        with:
          name: SecLab-macOS-arm64
          path: |
            target/dist/*.zip
            target/dist/*.pkg
            target/dist/release-notes.md
          if-no-files-found: error

  linux:
    name: Linux bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Same package set as the `cross-platform` job in ci.yml (see the comment there): ALSA
      # headers for cpal/midir, X11/GL headers for the `x11` crate behind the plugin editor.
      - name: install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libx11-dev libx11-xcb-dev libgl-dev
      # bundle-vst3 first bundles the CLAP (with the embedded editor), then wraps it into a
      # VST3 with clap-wrapper (cmake + the runner's C++ toolchain; fetches the VST3 SDK).
      - name: build the CLAP and the VST3 wrapper
        run: cargo xtask bundle-vst3
      - name: build the native standalone
        run: cargo build --release -p seclab-standalone
      - name: package the bundles
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME:-dev}"
          version="${version//\//-}"
          [[ "$version" =~ ^v[0-9] ]] && version="${version#v}"
          dist="$PWD/target/dist"
          stage="$PWD/target/stage"
          rm -rf "$stage" && mkdir -p "$dist" "$stage"
          cp -r target/bundled/seclab-plugin.clap "$stage/"
          cp -r target/bundled/seclab-plugin.vst3 "$stage/"
          cp target/release/seclab-standalone "$stage/"
          cp LICENSE NOTICE EULA-BETA.md "$stage/"
          archive="$dist/SecLab-${version}-Linux-x86_64.zip"
          (cd "$stage" && zip -r -q "$archive" .)
          echo "packaged $archive"
      - name: upload the Linux bundles artifact
        uses: actions/upload-artifact@v4
        with:
          name: SecLab-Linux-x86_64
          path: target/dist/*.zip
          if-no-files-found: error

  windows:
    name: Windows bundles
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # bundle-vst3 first bundles the CLAP (with the embedded editor), then wraps it into a
      # VST3 with clap-wrapper (cmake + the runner's C++ toolchain; fetches the VST3 SDK).
      - name: build the CLAP and the VST3 wrapper
        run: cargo xtask bundle-vst3
      - name: build the native standalone
        run: cargo build --release -p seclab-standalone
      - name: package the bundles
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "dev" }
          $version = $version.Replace("/", "-")
          if ($version -match '^v\d') { $version = $version.Substring(1) }
          $dist = "target/dist"
          $stage = "target/stage"
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          New-Item -ItemType Directory -Force -Path $dist, $stage | Out-Null
          Copy-Item -Recurse target/bundled/seclab-plugin.clap $stage/
          Copy-Item -Recurse target/bundled/seclab-plugin.vst3 $stage/
          Copy-Item target/release/seclab-standalone.exe $stage/
          Copy-Item LICENSE, NOTICE, EULA-BETA.md $stage/
          $archive = "$dist/SecLab-$version-Windows-x86_64.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $archive -Force
          Write-Host "packaged $archive"
      - name: upload the Windows bundles artifact
        uses: actions/upload-artifact@v4
        with:
          name: SecLab-Windows-x86_64
          path: target/dist/*.zip
          if-no-files-found: error

  # On a version tag: one DRAFT pre-release with every leg's files, a SHA256SUMS.txt and the
  # CHANGELOG notes. Nothing becomes public until a maintainer reviews it and clicks Publish.
  publish:
    name: Draft GitHub Release
    needs: [macos, linux, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum SecLab-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: create the draft pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft --prerelease \
            --verify-tag \
            --title "SecLab $version (public beta)" \
            --notes-file dist/release-notes.md \
            dist/SecLab-* dist/SHA256SUMS.txt
