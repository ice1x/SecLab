name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# All required CI runs on the self-hosted macOS/ARM64 runner: GitHub-hosted runners are
# currently unavailable for this private repo (account billing), so cloud legs would
# never start. The machine has rustup/stable with rustfmt+clippy preinstalled and keeps
# a persistent work dir, so it needs neither the toolchain action nor the cache action.
# Cross-platform (Linux/Windows) coverage lives in cross-platform.yml, manually
# dispatchable once billing is restored.
jobs:
  fmt:
    name: rustfmt
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --all --check

  check:
    name: clippy & test (macos-self-hosted)
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4
      - name: clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace

  # clap-validator is installed machine-wide on the runner
  # (cargo install --git https://github.com/free-audio/clap-validator.git).
  # pluginval joins for VST3/AU once those exports land (000069/000070).
  plugin-validate:
    name: clap-validator (macos-self-hosted)
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4
      - run: cargo xtask validate
