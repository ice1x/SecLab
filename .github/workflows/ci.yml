name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# CI runs on GitHub-hosted macOS runners (`macos-15`, Apple Silicon / ARM64 — the project's
# native target). The repo is public, so hosted macOS minutes are free, and this removes the
# dependency on the developer's self-hosted Mac being online.
#
# IMAGE LIFETIME: GitHub retires macOS runner images roughly yearly and announces it in
# https://github.com/actions/runner-images/issues (label `announcement`). We first landed on
# `macos-14`, which GitHub Actions retired on 2026-11-02 (runner-images#13518) — the very
# next push failed every job in 0 s with "The configuration 'macos-14-arm64-us-default' is
# not supported", so the label is a pinned, perishable choice, not a stable one. When this
# happens again, bump the label here (and the `clap-validator-<image>` cache key below);
# `macos-latest` would self-roll but can break the build on an unplanned day instead.
#
# Unlike the old self-hosted
# runner (which had the toolchain and build tools preinstalled and a persistent work dir),
# each hosted job is ephemeral, so every job installs its toolchain with
# `dtolnay/rust-toolchain` and restores the cargo/target cache with `Swatinem/rust-cache`.
#
# drevo coupling: the patch-library crate (seclab-library) depends on `drevo` as a PINNED
# GIT dependency (it used to be an absolute local path). drevo is OPTIONAL and only compiled
# under `--features library`, but Cargo resolves every dependency's manifest for the lockfile
# regardless of features — so an absolute-path dep made every workspace command fail on any
# machine without that exact path, which is why CI could not run on hosted runners before. A
# git source resolves identically everywhere; `cargo metadata --no-deps` (the fmt gate) does
# not even fetch it. See crates/seclab-library/Cargo.toml.
#
# Cross-platform (Linux/Windows) coverage lives in cross-platform.yml.
jobs:
  fmt:
    name: rustfmt
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # Format-check only THIS workspace's crates, never `--all`. `cargo fmt --all` descends
      # into local path-based dependency packages, so scoping to the workspace members keeps
      # the gate independent of any sibling checkout. The members are enumerated from `cargo
      # metadata --no-deps` so a newly-added crate is picked up automatically (no hand list,
      # and `cargo fmt` has no `--exclude`). `--no-deps` never touches the drevo git source.
      - name: rustfmt (workspace crates only)
        run: |
          cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[].name' \
            | sed 's/^/-p /' \
            | xargs cargo fmt --check

  check:
    name: clippy & test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace

  # clap-validator is `cargo install`'d and cached (it is not on the hosted image). pluginval
  # joins for VST3/AU once those exports are gated in. `cargo xtask validate` bundles the
  # release plugin with nih-plug's bundler (no cmake / clap-wrapper — those are only for the
  # wrapped VST3/AU formats) and runs clap-validator over the produced `.clap`.
  plugin-validate:
    name: clap-validator
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cache the clap-validator binary
        id: clap-validator-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/clap-validator
          key: clap-validator-macos-15-v1
      - name: install clap-validator
        if: steps.clap-validator-cache.outputs.cache-hit != 'true'
        run: cargo install --git https://github.com/free-audio/clap-validator.git
      - name: validate the CLAP bundle
        run: cargo xtask validate

  # Advisory line coverage. cargo-llvm-cov + the llvm-tools component are installed here (the
  # hosted image has neither). NON-blocking (continue-on-error): coverage is a signal, not a
  # gate, so a tooling hiccup or a dip in the number never fails the merge. PR-only.
  coverage:
    name: coverage
    runs-on: macos-15
    if: ${{ github.event_name == 'pull_request' }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: install cargo-llvm-cov
        run: cargo install cargo-llvm-cov
      - name: line coverage summary
        run: cargo llvm-cov --workspace --summary-only

  # Opt-in drevo-backed library (Epic 11). The `library` feature compiles the embedded drevo
  # dependency (resolved from the pinned git rev on CI) and runs its CRUD smoke test.
  # NON-blocking: the default workspace build never compiles drevo, so the required gates do
  # not hinge on it. PR-only.
  library:
    name: library / drevo
    runs-on: macos-15
    if: ${{ github.event_name == 'pull_request' }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: drevo CRUD smoke test
        run: cargo test -p seclab-library --features library

  # Compile-check of the embedded plugin editor (000067, `gui` feature — egui/baseview).
  # NON-blocking: the required clap-validator gate builds the plugin WITHOUT the editor, so a
  # headless runner never opens a window; this only proves the GUI code still compiles. PR-only.
  gui:
    name: plugin editor / gui
    runs-on: macos-15
    if: ${{ github.event_name == 'pull_request' }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build the plugin with the editor
        run: cargo build -p seclab-plugin --features gui

  # Native-only AI assistant panel (000108, `assistant` feature). The panel renders the
  # seclab-ai EditSession view-model, pulling in the provider/HTTP stack; it is OFF by default
  # (the required clippy/test gate builds seclab-editor WITHOUT it, and the wasm job proves it
  # never leaks into the browser build). This job compiles and tests the panel under the
  # feature so the code cannot rot. NON-blocking. PR-only.
  assistant:
    name: assistant panel
    runs-on: macos-15
    if: ${{ github.event_name == 'pull_request' }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy the assistant panel (deny warnings)
        run: cargo clippy -p seclab-editor --features assistant --all-targets -- -D warnings
      - name: test the assistant panel
        run: cargo test -p seclab-editor --features assistant
      # The `assistant-net` layer adds the real network providers (reqwest + OS keychain). We
      # only COMPILE it here — it opens no socket and touches no keychain — so the threaded
      # host's Anthropic/local constructors cannot rot. clippy (deny warnings) covers them.
      - name: clippy the assistant-net providers (deny warnings)
        run: cargo clippy -p seclab-editor --features assistant-net --all-targets -- -D warnings

  # WASM proof of concept (backlog 000081): the editor compiles to the browser target and the
  # platform-agnostic core (engine/nodes/project format) is portable. NON-blocking — the
  # wasm32 toolchain is not a required gate — this only proves the web path still builds. PR-only.
  wasm:
    name: wasm build
    runs-on: macos-15
    if: ${{ github.event_name == 'pull_request' }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: build the core crates for wasm32
        run: cargo build -p seclab-core -p seclab-nodes -p seclab-project -p seclab-runtime --target wasm32-unknown-unknown
      # The browser audio engine (000083): the nih-plug-free instrument core plus its
      # AudioWorklet binding must keep compiling to a loadable wasm module.
      - name: build the audio engine for wasm32 (WebAudio/AudioWorklet path)
        run: cargo build -p seclab-engine --target wasm32-unknown-unknown
      - name: build the editor for wasm32 (browser entry point)
        run: cargo build -p seclab-editor --target wasm32-unknown-unknown
      # The runnable browser editor host (web/editor/): prove the wasm-pack `--target web`
      # bundle — the wasm-bindgen `start(canvas)` glue the page imports — still builds, so the
      # host page cannot rot. Output is git-ignored.
      - name: build the browser editor host bundle (wasm-pack --target web)
        run: |
          command -v wasm-pack >/dev/null 2>&1 || cargo install wasm-pack
          wasm-pack build crates/seclab-editor --target web \
            --out-dir ../../web/editor/pkg --out-name seclab_editor
      # The default seclab-library must stay wasm-portable: the drevo/redb knowledge graph is a
      # native-only capability behind the off-by-default `library` feature (000099). Building
      # the default here guards the boundary defined in docs/architecture-boundary.md.
      - name: build the default library façade for wasm32
        run: cargo build -p seclab-library --target wasm32-unknown-unknown

  # Browser audio prototype (backlog 000083): build the seclab-engine wasm package with its JS
  # bindings and run the headless Node smoke test — the exact Rust → wasm → JS path the browser
  # AudioWorklet drives (silent at rest, audible on a note, decays on release). NON-blocking:
  # the wasm/JS toolchain is not a required gate. See web/audio/. PR-only.
  browser-audio:
    name: browser audio
    runs-on: macos-15
    if: ${{ github.event_name == 'pull_request' }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: ensure wasm-pack is available
        run: command -v wasm-pack >/dev/null 2>&1 || cargo install wasm-pack
      - name: build the audio engine to a Node wasm package
        run: wasm-pack build crates/seclab-engine --target nodejs --out-dir ../../web/audio/pkg-node --out-name seclab_engine
      - name: run the headless audio smoke test
        run: node web/audio/test/smoke.mjs

  # AudioUnit wrapper build (000092): build the AUv2 `.component` via clap-wrapper + cmake —
  # the compile/link regression guard for the wrapped-AU export. NON-blocking signal, PR-only.
  #
  # We deliberately do NOT run Apple's `auval` here. auval validates an AU by loading it
  # through the system AudioComponent registry, and a headless GitHub-hosted runner has no
  # logged-in audio session to register a freshly installed third-party component — auval
  # always reports "Cannot get Component's Name strings" / error -50 / "didn't find the
  # component", even after ad-hoc code-signing and kicking AudioComponentRegistrar (tried,
  # did not help). The authoritative plugin gate on CI is the required `clap-validator` job
  # (the CLAP is the primary format here); run the full `cargo xtask validate-au` (build +
  # auval) locally or on a machine with a real session when the AU export needs validating.
  au-build:
    name: au build (wrapper)
    runs-on: macos-15
    if: ${{ github.event_name == 'pull_request' }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build the AUv2 via clap-wrapper
        run: cargo xtask bundle-auv2
