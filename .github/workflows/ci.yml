name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# All required CI runs on the self-hosted macOS/ARM64 runner: GitHub-hosted runners are
# currently unavailable for this private repo (account billing), so cloud legs would
# never start. The machine has rustup/stable with rustfmt+clippy preinstalled and keeps
# a persistent work dir, so it needs neither the toolchain action nor the cache action.
# Cross-platform (Linux/Windows) coverage lives in cross-platform.yml, manually
# dispatchable once billing is restored.
jobs:
  fmt:
    name: rustfmt
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4
      # Format-check only THIS workspace's crates, never `--all`. `cargo fmt --all`
      # descends into local path-dependency packages, and `vb-library` depends on the
      # sibling `drevo` checkout by absolute path — so `--all` would format ~184 drevo
      # files and fail this required gate whenever that shared, external working tree has
      # unformatted edits (another dev/session mid-work). We scope to workspace members,
      # enumerated from `cargo metadata --no-deps` so a newly-added crate is picked up
      # automatically (no hand-maintained list, and `cargo fmt` has no `--exclude`).
      - name: rustfmt (workspace crates only, excludes path-dep drevo)
        run: |
          cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[].name' \
            | sed 's/^/-p /' \
            | xargs cargo fmt --check

  check:
    name: clippy & test (macos-self-hosted)
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4
      - name: clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace

  # clap-validator is installed machine-wide on the runner
  # (cargo install --git https://github.com/free-audio/clap-validator.git).
  # pluginval joins for VST3/AU once those exports land (000069/000070).
  plugin-validate:
    name: clap-validator (macos-self-hosted)
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4
      - run: cargo xtask validate

  # Advisory line coverage. cargo-llvm-cov and the llvm-tools rustup component are
  # installed on the runner. This job is NON-blocking (continue-on-error): coverage is a
  # signal, not a gate, so a tooling hiccup or a dip in the number never fails the merge.
  coverage:
    name: coverage (macos-self-hosted)
    runs-on: [self-hosted, macOS, ARM64]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: line coverage summary
        run: cargo llvm-cov --workspace --summary-only

  # Opt-in drevo-backed library (Epic 11). The `library` feature compiles the embedded
  # drevo dependency and runs its CRUD smoke test. NON-blocking: it depends on the sibling
  # `drevo` crate on the runner machine, so the required gate never hinges on an external
  # crate's state. The default jobs above do not build drevo.
  library:
    name: library / drevo (macos-self-hosted)
    runs-on: [self-hosted, macOS, ARM64]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: drevo CRUD smoke test
        run: cargo test -p vb-library --features library

  # Compile-check of the embedded plugin editor (000067, `gui` feature — egui/baseview).
  # NON-blocking: the required clap-validator gate builds the plugin WITHOUT the editor, so
  # a headless runner never opens a window; this only proves the GUI code still compiles.
  gui:
    name: plugin editor / gui (macos-self-hosted)
    runs-on: [self-hosted, macOS, ARM64]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: build the plugin with the editor
        run: cargo build -p vb-plugin --features gui

  # Native-only AI assistant panel (000108, `assistant` feature). The panel renders the
  # vb-ai EditSession view-model, so it pulls in the provider/HTTP stack and is OFF by
  # default — the required clippy/test gate above builds vb-editor WITHOUT it, and the wasm
  # job proves it never leaks into the browser build. This job compiles and tests the panel
  # under the feature so the code cannot rot. NON-blocking: an optional native feature, like
  # `gui` and `library`, is a signal rather than a required gate.
  assistant:
    name: assistant panel (macos-self-hosted)
    runs-on: [self-hosted, macOS, ARM64]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: clippy the assistant panel (deny warnings)
        run: cargo clippy -p vb-editor --features assistant --all-targets -- -D warnings
      - name: test the assistant panel
        run: cargo test -p vb-editor --features assistant

  # WASM proof of concept (backlog 000081): the editor compiles to the browser target and
  # the platform-agnostic core (engine/nodes/project format) is portable. NON-blocking —
  # the wasm32 toolchain is not a required gate — this only proves the web path still builds.
  wasm:
    name: wasm build (macos-self-hosted)
    runs-on: [self-hosted, macOS, ARM64]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: add the wasm32 target
        run: rustup target add wasm32-unknown-unknown
      - name: build the core crates for wasm32
        run: cargo build -p vb-core -p vb-nodes -p vb-project -p vb-runtime --target wasm32-unknown-unknown
      # The browser audio engine (000083): the nih-plug-free instrument core plus its
      # AudioWorklet binding must keep compiling to a loadable wasm module.
      - name: build the audio engine for wasm32 (WebAudio/AudioWorklet path)
        run: cargo build -p vb-engine --target wasm32-unknown-unknown
      - name: build the editor for wasm32 (browser entry point)
        run: cargo build -p vb-editor --target wasm32-unknown-unknown
      # The default vb-library must stay wasm-portable: the drevo/redb knowledge graph is a
      # native-only capability behind the off-by-default `library` feature (000099). Building
      # the default here guards the boundary defined in docs/architecture-boundary.md.
      - name: build the default library façade for wasm32
        run: cargo build -p vb-library --target wasm32-unknown-unknown

  # Browser audio prototype (backlog 000083): build the vb-engine wasm package with its JS
  # bindings and run the headless Node smoke test — the exact Rust → wasm → JS path the
  # browser AudioWorklet drives (silent at rest, audible on a note, decays on release).
  # NON-blocking: the wasm/JS toolchain is not a required gate. See web/audio/.
  browser-audio:
    name: browser audio (macos-self-hosted)
    runs-on: [self-hosted, macOS, ARM64]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: ensure wasm-pack is available
        run: command -v wasm-pack >/dev/null 2>&1 || cargo install wasm-pack
      - name: build the audio engine to a Node wasm package
        run: wasm-pack build crates/vb-engine --target nodejs --out-dir ../../web/audio/pkg-node --out-name vb_engine
      - name: run the headless audio smoke test
        run: node web/audio/test/smoke.mjs

  # AudioUnit validation (000092): build the AUv2 via clap-wrapper and run Apple's `auval`
  # on it — the authoritative check that the exported AU actually loads, negotiates formats,
  # renders at every sample rate, and handles parameters/MIDI. NON-blocking: the wrapped-AU
  # build is heavy (clones/builds clap-wrapper) and auval is macOS-only, so it is a signal,
  # not a required gate. The required CLAP gate stays `clap-validator`.
  au-validate:
    name: au validate (macos-self-hosted)
    runs-on: [self-hosted, macOS, ARM64]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      # validate-au builds+installs the AUv2 itself, then runs auval — one step so the build
      # and validation resolve the same target/bundled path (the runner checkout is nested
      # inside the developer clone, so splitting them let the two disagree).
      - name: build the AUv2 and validate it with auval
        run: cargo xtask validate-au
