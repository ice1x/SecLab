[workspace]
resolver = "2"
members = [
    "crates/vb-core",
    "crates/vb-nodes",
    "crates/vb-project",
    "crates/vb-runtime",
    "crates/vb-editor",
    "crates/vb-standalone",
    "crates/vb-plugin",
]

# Shared package metadata inherited by every crate via `field.workspace = true`.
[workspace.package]
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/ice1x/VST_bomb"
authors = ["ice1x"]

# Shared dependencies land here as the project grows (nih-plug, egui, cpal, …).
[workspace.dependencies]
vb-core = { path = "crates/vb-core" }
vb-nodes = { path = "crates/vb-nodes" }
vb-runtime = { path = "crates/vb-runtime" }
vb-editor = { path = "crates/vb-editor" }
cpal = "0.18"
midir = "0.11"
criterion = "0.8"
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", default-features = false, features = ["assert_process_allocs"] }
vb-project = { path = "crates/vb-project" }
serde = { version = "1", features = ["derive"] }
ron = "0.12"
egui = "0.36"
eframe = { version = "0.36", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
